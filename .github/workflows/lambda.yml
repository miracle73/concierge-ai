name: Lambda build
on: { workflow_dispatch: {}, push: { branches: [main], paths: ["api/**"] } }
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install cargo-lambda && cargo lambda build --release --arm64 --output-format zip
      - uses: actions/upload-artifact@v4
        with: { name: lambda, path: api/target/lambda/concierge-api/bootstrap.zip }
